<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Active Quest Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" />

  <style>
    :root {
      /* Display face for the clock, title and labels; the evidence line and
         the weekly question stay in the body sans for readability. */
      --hud-font: "Orbitron", Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      --text: #fff;
      --muted: rgba(255,255,255,.66);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --video-crossfade-ms: 800ms;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    .app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    .quest-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #000;
      opacity: 0;
      transition: opacity var(--video-crossfade-ms) ease-in-out;
      will-change: opacity;
    }

    .quest-video.active {
      opacity: 1;
    }

    .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          rgba(0,0,0,.64) 0%,
          rgba(0,0,0,.40) 30%,
          rgba(0,0,0,.10) 52%,
          rgba(0,0,0,0) 72%),
        linear-gradient(0deg,
          rgba(0,0,0,.25) 0%,
          rgba(0,0,0,0) 38%);
    }

    .panel {
      position: absolute;
      left: calc(clamp(26px, 4.5vw, 88px) + var(--safe-left));
      top: 45%;
      transform: translateY(-50%);
      width: min(39vw, 720px);
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      pointer-events: none;
      text-shadow: 0 2px 14px rgba(0,0,0,.72);
    }

    .clock {
      margin-bottom: clamp(18px, 1.8vw, 32px);
      padding-bottom: clamp(16px, 1.6vw, 28px);
      border-bottom: 1px solid rgba(255,255,255,.22);
    }

    /* fitClock() sets font-size so the widest possible time spans the panel;
       the clamp is only the size shown before the font has loaded.
       justifyClock() sets margin-left, letter-spacing and margin-right each
       minute so the digits' ink runs edge to edge. */
    .clock-time {
      display: inline-block;
      font-family: var(--hud-font);
      font-size: clamp(72px, 8.4vw, 168px);
      line-height: .82;
      font-weight: 900;
      white-space: nowrap;
    }

    .clock-date {
      margin-top: 14px;
      font-family: var(--hud-font);
      font-size: clamp(11px, .82vw, 16px);
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,.7);
    }

    .phase-track {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-family: var(--hud-font);
      font-size: clamp(10px, .72vw, 14px);
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .phase-step { color: rgba(255,255,255,.30); }
    .phase-step.done { color: rgba(255,255,255,.58); }
    .phase-step.current { color: #fff; }

    .phase-step + .phase-step::before {
      content: "";
      display: inline-block;
      width: 18px;
      height: 1px;
      margin-right: 10px;
      vertical-align: middle;
      background: rgba(255,255,255,.30);
    }

    .title {
      margin: 0 0 22px;
      font-family: var(--hud-font);
      font-size: clamp(24px, 2.15vw, 44px);
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: .01em;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .status-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 18px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      font-family: var(--hud-font);
      font-size: clamp(10px, .74vw, 14px);
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
      background: rgba(255,255,255,.10);
      border: 1px solid currentColor;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 12px currentColor;
      flex: 0 0 auto;
    }

    .status.strong { color: #8ef5b2; }
    .status.forward { color: #b6e5ff; }
    .status.slow { color: #ffe59a; }
    .status.stalled { color: #ff9c9c; }
    .status.unknown { color: #d4d8df; }

    /* The matcher only writes Dashboard Status when it finds new evidence, so
       the badge never decays on its own. Fade it once the quest has gone quiet
       so an old "MOVING FORWARD" does not read as current. */
    .status.stale { opacity: .5; }

    .freshness {
      font-family: var(--hud-font);
      font-size: clamp(10px, .72vw, 14px);
      font-weight: 700;
      letter-spacing: .08em;
      color: rgba(255,255,255,.66);
    }

    .freshness.quiet { color: #ffc98a; }

    .next-move {
      margin-bottom: 14px;
      font-size: clamp(17px, 1.4vw, 27px);
      line-height: 1.3;
      font-weight: 720;
    }

    .next-label {
      margin-right: 10px;
      font-family: var(--hud-font);
      font-size: .62em;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
      color: rgba(255,255,255,.62);
      vertical-align: .12em;
    }

    .statement {
      margin-bottom: 0;
      font-size: clamp(15px, 1.15vw, 22px);
      line-height: 1.38;
      font-weight: 520;
      color: rgba(255,255,255,.93);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      /* .panel is pointer-events:none, so re-enable here or the
         title="" tooltip with the full text can never be shown. */
      pointer-events: auto;
    }

    .countdown {
      margin-top: 16px;
      font-family: var(--hud-font);
      font-size: clamp(11px, .8vw, 15px);
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.82);
    }

    .pass-fail {
      margin-top: 22px;
      padding-left: 14px;
      border-left: 2px solid rgba(255,255,255,.35);
      font-size: clamp(13px, .95vw, 18px);
      line-height: 1.35;
      font-style: italic;
      color: rgba(255,255,255,.72);
    }

    .quote {
      position: absolute;
      right: calc(clamp(30px, 5vw, 92px) + var(--safe-right));
      bottom: calc(clamp(30px, 5vw, 84px) + var(--safe-bottom));
      width: min(42vw, 760px);
      text-align: right;
      pointer-events: none;
      text-shadow: 0 2px 18px rgba(0,0,0,.82);
    }

    .quote-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 2vw, 40px);
      line-height: 1.22;
      font-style: italic;
      text-wrap: balance;
    }

    .quote-author {
      margin-top: 11px;
      font-size: clamp(11px, .86vw, 16px);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <main class="app">
    <video id="questVideoA" class="quest-video active" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
    <video id="questVideoB" class="quest-video" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
    <div class="shade"></div>

    <section class="panel">
      <div class="clock">
        <div id="clockTime" class="clock-time"></div>
        <div id="clockDate" class="clock-date"></div>
      </div>
      <div id="phaseTrack" class="phase-track"></div>
      <h1 id="questTitle" class="title"></h1>
      <div class="status-row">
        <div id="questStatus" class="status unknown"></div>
        <div id="freshness" class="freshness"></div>
      </div>
      <div id="nextMove" class="next-move"></div>
      <div id="questLine" class="statement"></div>
      <div id="countdown" class="countdown"></div>
      <div id="passFail" class="pass-fail"></div>
    </section>

    <aside id="quoteBlock" class="quote hidden">
      <div id="quoteText" class="quote-text"></div>
      <div id="quoteAuthor" class="quote-author"></div>
    </aside>

  </main>

  <script>
    const DATA_URL = "./data.json";
    const VIDEO_LIST_URL = "https://res.cloudinary.com/a3xk0plk/video/list/quest-board-animated.json";
    const REFRESH_MS = 15000;
    const ROTATE_MS = 30000;
    const CROSSFADE_MS = 800;
    const LINE_MAX_CHARS = 100;
    const NEXT_MAX_CHARS = 70;
    const PASS_FAIL_MAX_CHARS = 90;
    // After this many days without new evidence the quest counts as quiet.
    const QUIET_AFTER_DAYS = 7;
    const PHASES = ["Start", "Build", "Push", "Finish"];

    const videos = [
      document.getElementById("questVideoA"),
      document.getElementById("questVideoB")
    ];

    for (const video of videos) {
      video.autoplay = true;
      video.muted = true;
      video.defaultMuted = true;
      video.loop = true;
      video.playsInline = true;
    }

    const el = {
      phase: document.getElementById("phaseTrack"),
      title: document.getElementById("questTitle"),
      status: document.getElementById("questStatus"),
      freshness: document.getElementById("freshness"),
      next: document.getElementById("nextMove"),
      line: document.getElementById("questLine"),
      countdown: document.getElementById("countdown"),
      passFail: document.getElementById("passFail"),
      quoteBlock: document.getElementById("quoteBlock"),
      quote: document.getElementById("quoteText"),
      author: document.getElementById("quoteAuthor")
    };

    let quests = [];
    let currentIndex = 0;
    let activeVideoIndex = 0;
    let loadedVideoKey = "";
    let transitionToken = 0;

    function normalizeId(value = "") {
      return String(value).replace(/-/g, "").toLowerCase();
    }

    function idFromPublicId(publicId = "") {
      return String(publicId).split("/").pop() || "";
    }

    function statusClass(status = "") {
      if (status === "STRONG PROGRESS") return "strong";
      if (status === "MOVING FORWARD") return "forward";
      if (status === "SLOW PROGRESS") return "slow";
      if (status === "STALLED") return "stalled";
      return "unknown";
    }

    // Notion dates arrive as "YYYY-MM-DD". Parse them as local calendar days;
    // new Date("YYYY-MM-DD") is UTC midnight and can land on the wrong day.
    function parseDay(value) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(value || ""));
      return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
    }

    function daysBetween(from, to) {
      return Math.round((to - from) / 86400000);
    }

    function today() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function shortDate(d) {
      return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
    }

    function quietDays(quest) {
      const d = parseDay(quest.updatedAt);
      return d ? Math.max(0, daysBetween(d, today())) : null;
    }

    function freshnessText(days) {
      if (days === null) return "";
      if (days === 0) return "Evidence today";
      if (days === 1) return "Evidence yesterday";
      if (days > QUIET_AFTER_DAYS) return `Quiet for ${days} days`;
      return `Evidence ${days} days ago`;
    }

    function countdownText(quest) {
      const target = parseDay(quest.targetDate);
      if (!target) return "";
      const days = daysBetween(today(), target);
      const when = shortDate(target);
      if (days > 1) return `${days} days to go · ${when}`;
      if (days === 1) return `Tomorrow · ${when}`;
      if (days === 0) return `Today is the day · ${when}`;
      return `${-days} days past target · ${when}`;
    }

    function renderPhase(phase) {
      const current = PHASES.indexOf(phase);
      el.phase.replaceChildren(...(current < 0 ? [] : PHASES.map((name, i) => {
        const step = document.createElement("span");
        step.className = "phase-step" + (i < current ? " done" : i === current ? " current" : "");
        step.textContent = name;
        return step;
      })));
      el.phase.classList.toggle("hidden", current < 0);
    }

    function setText(node, text, max) {
      node.textContent = max ? clipLine(text, max) : text;
      node.title = text;
      node.classList.toggle("hidden", !text);
    }

    // The card shows exactly ONE body line. latestEvidence is the display
    // field; statusStatement is a copy of the agent's internal progress
    // assessment and is only used when evidence is empty. Because only one of
    // the two is ever rendered, the card can never repeat the same numbers in
    // a statement and an evidence line at the same time.
    function cardLine(quest) {
      const evidence = String(quest.latestEvidence || "").trim();
      if (evidence) return evidence;
      return String(quest.statusStatement || "").trim();
    }

    function clipLine(text, max = LINE_MAX_CHARS) {
      const clean = String(text || "").replace(/\s+/g, " ").trim();
      if (clean.length <= max) return clean;

      const head = clean.slice(0, max + 1);
      const lastSpace = head.lastIndexOf(" ");
      const cut = lastSpace > max * 0.6 ? head.slice(0, lastSpace) : clean.slice(0, max);
      return cut.replace(/[\s.,;:!?\u2013\u2014-]+$/, "") + "\u2026";
    }

    function renderQuest(quest) {
      if (!quest) return;

      renderPhase(quest.questPhase);
      el.title.textContent = quest.questTitle || "";

      const quiet = quietDays(quest);
      const isQuiet = quiet !== null && quiet > QUIET_AFTER_DAYS;
      el.status.textContent = quest.status || "NOT ENOUGH INFORMATION";
      el.status.className = "status " + statusClass(quest.status) + (isQuiet ? " stale" : "");
      el.freshness.textContent = freshnessText(quiet);
      el.freshness.classList.toggle("quiet", isQuiet);
      el.freshness.classList.toggle("hidden", quiet === null);

      // Next move and the pass/fail question are written by hand in Notion,
      // so they are optional: a quest without them simply hides the row.
      const next = String(quest.nextMove || "").trim();
      el.next.replaceChildren();
      if (next) {
        const label = document.createElement("span");
        label.className = "next-label";
        label.textContent = "Next";
        el.next.append(label, clipLine(next, NEXT_MAX_CHARS));
      }
      el.next.title = next;
      el.next.classList.toggle("hidden", !next);

      setText(el.line, cardLine(quest), LINE_MAX_CHARS);
      setText(el.countdown, countdownText(quest));
      setText(el.passFail, String(quest.passFailQuestion || "").trim(), PASS_FAIL_MAX_CHARS);

      el.quote.textContent = quest.quote ? `“${quest.quote}”` : "";
      el.author.textContent = quest.quoteAuthor || "";
      el.quoteBlock.classList.toggle("hidden", !quest.quote);

      loadVideo(quest);
    }

    function videoKeyForQuest(quest, url) {
      return [
        quest.id || "",
        quest.resolvedVideoVersion || quest.video_version || "",
        url
      ].join("|");
    }

    function clearVideo(video) {
      video.pause();
      video.classList.remove("active");
      video.removeAttribute("src");
      video.load();
    }

    function loadVideo(quest) {
      const url = quest.resolvedVideoUrl || quest.video_url || "";
      if (!url) return;

      const key = videoKeyForQuest(quest, url);
      if (key === loadedVideoKey) return;

      const token = ++transitionToken;
      const outgoingIndex = activeVideoIndex;
      const incomingIndex = outgoingIndex === 0 ? 1 : 0;
      const outgoing = videos[outgoingIndex];
      const incoming = videos[incomingIndex];

      incoming.pause();
      incoming.classList.remove("active");
      incoming.removeAttribute("src");
      incoming.load();
      incoming.src = url;
      incoming.currentTime = 0;
      incoming.load();

      const startCrossfade = async () => {
        if (token !== transitionToken) return;

        incoming.muted = true;
        incoming.defaultMuted = true;

        try {
          await incoming.play();
        } catch (err) {
          console.warn("Autoplay failed:", err);
          return;
        }

        if (token !== transitionToken) return;

        requestAnimationFrame(() => {
          if (token !== transitionToken) return;

          incoming.classList.add("active");
          outgoing.classList.remove("active");
          activeVideoIndex = incomingIndex;
          loadedVideoKey = key;

          setTimeout(() => {
            if (token !== transitionToken) return;
            outgoing.pause();
            outgoing.removeAttribute("src");
            outgoing.load();
          }, CROSSFADE_MS + 100);
        });
      };

      if (incoming.readyState >= 3) {
        startCrossfade();
      } else {
        incoming.addEventListener("canplay", startCrossfade, { once: true });
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), {
        cache: "no-store"
      });
      if (!response.ok) throw new Error(response.status + " " + response.statusText);
      return response.json();
    }

    async function refreshDashboard() {
      try {
        const [stateResult, videoResult] = await Promise.allSettled([
          fetchJson(DATA_URL),
          fetchJson(VIDEO_LIST_URL)
        ]);

        if (stateResult.status !== "fulfilled" || !Array.isArray(stateResult.value)) {
          console.warn("Could not load Active Quest data");
          return;
        }

        const state = stateResult.value;
        const videoMap = new Map();

        if (videoResult.status === "fulfilled") {
          for (const resource of (videoResult.value.resources || [])) {
            const id = idFromPublicId(resource.public_id);
            if (!id) continue;

            const exactUrl =
              resource.secure_url ||
              `https://res.cloudinary.com/a3xk0plk/video/upload/v${resource.version}/${resource.public_id}.${resource.format || "mp4"}`;

            videoMap.set(normalizeId(id), {
              url: exactUrl,
              version: resource.version
            });
          }
        }

        const previousId = quests[currentIndex]?.id || "";

        quests = state
          .filter(item => item && item.id)
          .map(item => {
            const asset = videoMap.get(normalizeId(item.id));
            return {
              ...item,
              resolvedVideoUrl: asset?.url || item.video_url || "",
              resolvedVideoVersion: asset?.version || item.video_version || ""
            };
          });

        if (!quests.length) return;

        if (previousId) {
          const matchedIndex = quests.findIndex(q => q.id === previousId);
          if (matchedIndex >= 0) currentIndex = matchedIndex;
        }

        if (currentIndex >= quests.length) currentIndex = 0;

        renderQuest(quests[currentIndex]);
      } catch (error) {
        console.error("Dashboard refresh failed:", error);
      }
    }

    const clockTime = document.getElementById("clockTime");
    const clockDate = document.getElementById("clockDate");

    function renderClock() {
      const now = new Date();
      const time = now.toLocaleTimeString(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      });
      if (clockTime.textContent !== time) {
        clockTime.textContent = time;
        justifyClock();
      }
      clockDate.textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        day: "numeric",
        month: "long"
      });
    }

    const inkCtx = document.createElement("canvas").getContext("2d");

    // Make the current time's ink run exactly from the panel's left edge to
    // its right edge.
    //
    // Width: spread the leftover width between the characters. Scaling the
    // font instead would nearly double the clock's height at 11:11 and push
    // the whole card around every minute; spacing keeps the height fixed.
    // letter-spacing is also added after the last character, so a matching
    // negative right margin keeps that trailing gap out of the layout.
    //
    // Edges: Orbitron's side-bearings differ per digit (about .06em of empty
    // space beside "0" or "8", almost none beside "1" or "7"), so the first
    // and last characters are measured on a canvas and their bearings
    // cancelled. Without this the clock drifts off the title's left edge and
    // stops short of the divider depending on the time.
    function justifyClock() {
      const text = clockTime.textContent;
      const style = getComputedStyle(clockTime);
      inkCtx.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
      const first = inkCtx.measureText(text.slice(0, 1));
      const last = inkCtx.measureText(text.slice(-1));
      const leftBearing = -first.actualBoundingBoxLeft;
      const rightBearing = last.width - last.actualBoundingBoxRight;

      clockTime.style.marginLeft = -leftBearing + "px";
      clockTime.style.letterSpacing = "0px";
      clockTime.style.marginRight = "0px";
      const gaps = text.length - 1;
      const extra = clockTime.parentElement.getBoundingClientRect().right
        - clockTime.getBoundingClientRect().right + rightBearing;
      if (gaps < 1 || extra <= 0) return;
      const gap = extra / gaps;
      clockTime.style.letterSpacing = gap + "px";
      clockTime.style.marginRight = -gap + "px";
    }

    // Size the clock so the widest possible time spans the panel exactly.
    // Orbitron's digits are proportional ("1" is half the width of "0"), so
    // measure the widest digit and the separator at 100px and scale from that.
    // The size then stays fixed all day and justifyClock() fills whatever
    // width a narrower time leaves over.
    function fitClock() {
      const target = clockTime.parentElement.clientWidth;
      clockTime.style.fontSize = "100px";
      clockTime.style.marginLeft = "0px";
      clockTime.style.letterSpacing = "0px";
      clockTime.style.marginRight = "0px";
      const measure = text => {
        clockTime.textContent = text;
        return clockTime.getBoundingClientRect().width;
      };
      let digit = 0;
      for (let d = 0; d <= 9; d++) digit = Math.max(digit, measure(String(d)));
      const sep = measure(":");

      clockTime.textContent = "";
      if (target && digit) {
        clockTime.style.fontSize = (100 * target / (4 * digit + sep)) + "px";
      }
      renderClock();
    }

    function nextQuest() {
      if (!quests.length) return;
      currentIndex = (currentIndex + 1) % quests.length;
      renderQuest(quests[currentIndex]);
    }

    renderClock();
    fitClock();
    // Refit once Orbitron arrives (the first fit measures the fallback font)
    // and whenever the panel width changes.
    document.fonts?.ready.then(fitClock);
    addEventListener("resize", fitClock);
    // Tick every second so the minute flips on time; the text only changes once a minute.
    setInterval(renderClock, 1000);
    refreshDashboard();
    setInterval(refreshDashboard, REFRESH_MS);
