<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quest Board Animated</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
    }

    .quest-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      opacity: 0;
      background: #000;
      pointer-events: none;
    }

    .quest-video.visible {
      opacity: 1;
    }
  </style>
</head>

<body>
  <video id="questA" class="quest-video" muted playsinline preload="auto"></video>
  <video id="questB" class="quest-video" muted playsinline preload="auto"></video>
  <audio id="questAudio" preload="auto" autoplay loop></audio>

  <script>
    const CLOUD_NAME = "a3xk0plk";
    const TAG = "quest-board-animated";
    const FOLDER_PREFIX = "Quest-Board-Animated/";

    const DISPLAY_TIME = 30000;
    const LIST_REFRESH_TIME = 60000;

    // Audio is the master clock.
    // The standby video is warmed before the boundary, then the visual layer
    // swaps shortly before the audio loops. This prevents cumulative drift.
    const WARM_STANDBY_REMAINING = 0.50;
    const VISUAL_SWAP_REMAINING = 0.06;
    const MAX_SYNC_DRIFT = 0.12;

    const LIST_URL =
      `https://res.cloudinary.com/${CLOUD_NAME}/video/list/${TAG}.json`;

    let quests = [];
    let currentIndex = 0;
    let activeLayer = 0;
    let started = false;
    let currentUrl = "";
    let switching = false;
    let standbyWarmed = false;
    let visualSwapDone = false;
    let lastAudioTime = 0;

    const layers = [
      document.getElementById("questA"),
      document.getElementById("questB")
    ];

    const audio = document.getElementById("questAudio");
    audio.volume = 1;

    function buildVideoUrl(resource) {
      return `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/v${resource.version}/${resource.public_id}.${resource.format}`;
    }

    async function playAudio(url, restart = true) {
      try {
        const absoluteUrl = new URL(url, window.location.href).href;

        if (audio.src !== absoluteUrl) {
          audio.src = url;
          audio.load();
        }

        if (restart) {
          try { audio.currentTime = 0; } catch (_) {}
        }

        await audio.play();
      } catch (error) {
        console.warn("Audio autoplay blocked; waiting for kiosk/browser permission or one user interaction.", error);
      }
    }

    function unlockAudio() {
      if (currentUrl) playAudio(currentUrl, false);
      document.removeEventListener("pointerdown", unlockAudio);
      document.removeEventListener("touchstart", unlockAudio);
    }

    document.addEventListener("pointerdown", unlockAudio, { passive: true });
    document.addEventListener("touchstart", unlockAudio, { passive: true });

    async function refreshQuestList() {
      try {
        const response = await fetch(
          `${LIST_URL}?refresh=${Date.now()}`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(`Cloudinary list error: ${response.status}`);
        }

        const data = await response.json();

        const newQuests = (data.resources || [])
          .filter(resource =>
            resource.public_id &&
            resource.public_id.startsWith(FOLDER_PREFIX)
          )
          .map(resource => ({
            publicId: resource.public_id,
            version: resource.version,
            url: buildVideoUrl(resource)
          }));

        if (!newQuests.length) {
          console.warn(`No tagged videos found in ${FOLDER_PREFIX}`);
          return;
        }

        quests = newQuests;

        if (currentIndex >= quests.length) {
          currentIndex = 0;
        }

        if (!started) {
          started = true;
          await showQuest(quests[currentIndex].url, true);
        }
      } catch (error) {
        console.error("Could not refresh quest video list:", error);
      }
    }

    function prepareVideo(video, url) {
      return new Promise((resolve, reject) => {
        video.pause();
        video.classList.remove("visible");

        const absoluteUrl = new URL(url, window.location.href).href;
        if (video.src !== absoluteUrl) {
          video.src = url;
          video.load();
        }

        if (video.readyState >= 3) {
          try { video.currentTime = 0; } catch (_) {}
          resolve();
          return;
        }

        const onReady = () => {
          cleanup();
          try { video.currentTime = 0; } catch (_) {}
          resolve();
        };

        const onError = () => {
          cleanup();
          reject(new Error(`Could not load video: ${url}`));
        };

        const cleanup = () => {
          video.removeEventListener("canplay", onReady);
          video.removeEventListener("error", onError);
        };

        video.addEventListener("canplay", onReady, { once: true });
        video.addEventListener("error", onError, { once: true });
      });
    }

    async function primeStandbyLayer(url) {
      const standby = layers[1 - activeLayer];
      try {
        await prepareVideo(standby, url);
        standby.pause();
        standby.currentTime = 0;
        standbyWarmed = false;
      } catch (error) {
        console.error("Could not prime standby layer:", error);
      }
    }

    async function warmStandby() {
      if (standbyWarmed || switching || !currentUrl) return;

      standbyWarmed = true;
      const standby = layers[1 - activeLayer];

      try {
        if (standby.readyState < 3) {
          await prepareVideo(standby, currentUrl);
        }

        standby.currentTime = 0;
        await standby.play();

        // Let the decoder produce frames while hidden, then reset to frame 0.
        setTimeout(() => {
          if (standby !== layers[activeLayer]) {
            standby.pause();
            standby.currentTime = 0;
          }
        }, 120);
      } catch (error) {
        console.error("Could not warm standby layer:", error);
      }
    }

    async function swapVisualAtAudioBoundary() {
      if (switching || visualSwapDone || !currentUrl) return;

      switching = true;
      visualSwapDone = true;

      const current = layers[activeLayer];
      const nextIndex = 1 - activeLayer;
      const next = layers[nextIndex];

      try {
        if (next.readyState < 3) {
          await prepareVideo(next, currentUrl);
        }

        next.currentTime = 0;
        await next.play();

        // Instant visual swap. Audio continues untouched as the master clock.
        next.classList.add("visible");
        current.classList.remove("visible");
        current.pause();
        current.currentTime = 0;

        activeLayer = nextIndex;
      } catch (error) {
        console.error("Could not swap visual layer:", error);
      } finally {
        switching = false;
      }
    }

    function monitorSync() {
      if (
        currentUrl &&
        !audio.paused &&
        Number.isFinite(audio.duration) &&
        audio.duration > 0
      ) {
        const audioTime = audio.currentTime;
        const remaining = audio.duration - audioTime;
        const active = layers[activeLayer];

        // Detect the audio loop boundary. This resets all per-loop flags and
        // makes every visual cycle start from the audio clock again.
        if (audioTime + 0.25 < lastAudioTime) {
          visualSwapDone = false;
          standbyWarmed = false;
          primeStandbyLayer(currentUrl);
        }

        if (!standbyWarmed && remaining <= WARM_STANDBY_REMAINING) {
          warmStandby();
        }

        if (!visualSwapDone && remaining <= VISUAL_SWAP_REMAINING) {
          swapVisualAtAudioBoundary();
        }

        // Outside the loop boundary, correct meaningful drift instead of
        // allowing it to accumulate across iterations.
        if (
          !switching &&
          !active.paused &&
          remaining > 0.5 &&
          Math.abs(active.currentTime - audioTime) > MAX_SYNC_DRIFT
        ) {
          try { active.currentTime = audioTime; } catch (_) {}
        }

        lastAudioTime = audioTime;
      }

      requestAnimationFrame(monitorSync);
    }

    async function showQuest(url, firstLoad = false) {
      if (switching) return;
      switching = true;
      standbyWarmed = false;
      visualSwapDone = false;
      lastAudioTime = 0;

      const nextIndex = firstLoad ? activeLayer : 1 - activeLayer;
      const next = layers[nextIndex];
      const current = layers[activeLayer];

      try {
        await prepareVideo(next, url);

        next.currentTime = 0;
        await next.play();
        next.classList.add("visible");

        if (!firstLoad && current !== next) {
          current.classList.remove("visible");
          current.pause();
          current.currentTime = 0;
        }

        activeLayer = nextIndex;
        currentUrl = url;

        await playAudio(url, true);
      } catch (error) {
        console.error(error);
      } finally {
        switching = false;
      }

      await primeStandbyLayer(url);
    }

    function nextQuest() {
      if (!quests.length || switching) return;

      currentIndex = (currentIndex + 1) % quests.length;
      showQuest(quests[currentIndex].url);
    }

    refreshQuestList();
    requestAnimationFrame(monitorSync);

    setInterval(nextQuest, DISPLAY_TIME);
    setInterval(refreshQuestList, LIST_REFRESH_TIME);
  </script>
</body>
</html>
