<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Active Quest Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" />

  <style>
    :root {
      /* One layout unit: 1vw on a 16:9 screen, capped by height on screens
         that are wider than 16:9, so the whole left column scales as a unit
         and always fits vertically. */
      --u: min(1vw, 1.7778vh);
      --pad-x: calc(var(--u) * 4.2);
      --pad-y: calc(var(--u) * 3.6);

      /* Display face for the clock, title and labels; the sentences
         (next move, evidence, weekly test) stay in the body sans. */
      --hud-font: "Orbitron", Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      --body-font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      --text: #fff;
      --label: rgba(255,255,255,.58);
      --rule: rgba(255,255,255,.2);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --video-crossfade-ms: 800ms;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: var(--body-font);
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    .app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    .quest-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #000;
      opacity: 0;
      transition: opacity var(--video-crossfade-ms) ease-in-out;
      will-change: opacity;
    }

    .quest-video.active {
      opacity: 1;
    }

    /* Darker on the left than before: the column now holds several lines of
       body text, which needs a calmer backdrop than a single headline did. */
    .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          rgba(0,0,0,.80) 0%,
          rgba(0,0,0,.66) 30%,
          rgba(0,0,0,.30) 48%,
          rgba(0,0,0,0) 64%),
        linear-gradient(0deg,
          rgba(0,0,0,.35) 0%,
          rgba(0,0,0,0) 40%);
    }

    /* Left column: the clock at the top with the quest block directly under
       it. --clock-w is the clock's live ink width, measured by alignClock(),
       and the date centers on it. */
    .panel {
      --clock-w: calc(var(--u) * 28);
      position: absolute;
      top: calc(var(--pad-y) + var(--safe-top));
      left: calc(var(--pad-x) + var(--safe-left));
      width: calc(var(--u) * 40);
      pointer-events: none;
      text-shadow: 0 2px 14px rgba(0,0,0,.6);
    }

    /* Shared label style: every section is introduced the same way. */
    .label {
      font-family: var(--hud-font);
      font-size: calc(var(--u) * .78);
      font-weight: 700;
      letter-spacing: .2em;
      white-space: nowrap;
      text-transform: uppercase;
      color: var(--label);
    }

    /* ---- Clock ---------------------------------------------------------- */

    .clock-time {
      font-family: var(--hud-font);
      font-size: calc(var(--u) * 9.5);
      font-weight: 900;
      line-height: .8;
      white-space: nowrap;
    }

    .clock-date {
      width: var(--clock-w);
      margin-top: calc(var(--u) * 1.2);
      text-align: center;
      font-family: var(--hud-font);
      font-size: calc(var(--u) * .95);
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
    }

    /* ---- Quest header --------------------------------------------------- */

    .quest-count {
      display: flex;
      align-items: center;
      gap: calc(var(--u) * .9);
    }

    .dots { display: flex; gap: calc(var(--u) * .45); }

    .dot {
      width: calc(var(--u) * .45);
      height: calc(var(--u) * .45);
      border-radius: 50%;
      background: rgba(255,255,255,.28);
    }

    .dot.on { background: #fff; }

    /* The quest block (title, divider, sections) shares one width so the
       whole column ends on one line under the clock. It is fixed rather than
       tied to the live clock: Orbitron's "1" is narrow, so the clock runs
       from 11:11 (about 17u) to 20:08 (about 33u), and tracking it re-wrapped
       the text every minute and squeezed the title to six lines at 11:11.
       24u is narrower than the clock 95% of the day. */
    .quest {
      width: calc(var(--u) * 24);
      margin-top: calc(var(--u) * 3.5);
    }

    /* At 2.5u every current title fits in three lines; the clamp keeps a
       longer future title from growing past that. */
    .title {
      margin: calc(var(--u) * .8) 0 0;
      font-family: var(--hud-font);
      font-size: calc(var(--u) * 2.5);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: .01em;
      text-transform: uppercase;
      text-wrap: balance;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      overflow: hidden;
    }

    .phase-track {
      display: flex;
      align-items: center;
      gap: calc(var(--u) * .6);
      margin-top: calc(var(--u) * 1.1);
    }

    .phase-step { color: rgba(255,255,255,.3); }
    .phase-step.done { color: rgba(255,255,255,.6); }
    .phase-step.current { color: #fff; }

    .phase-step + .phase-step::before {
      content: "";
      display: inline-block;
      width: calc(var(--u) * 1);
      height: 1px;
      margin-right: calc(var(--u) * .6);
      vertical-align: middle;
      background: rgba(255,255,255,.3);
    }

    /* ---- Sections ------------------------------------------------------- */

    /* One hairline separates the quest header from what to do about it. */
    .sections {
      margin-top: calc(var(--u) * 1.8);
      border-top: 1px solid var(--rule);
    }

    .section { margin-top: calc(var(--u) * 1.7); }

    /* balance evens out the lines so the narrow column never leaves a single
       word stranded on the last one ("…1 interval / run"). */
    .section-body {
      margin-top: calc(var(--u) * .5);
      text-wrap: balance;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
    }

    .next-body {
      font-size: calc(var(--u) * 1.55);
      font-weight: 700;
      line-height: 1.25;
    }

    /* The matcher writes evidence up to ~160 characters with several
       numbers in it, so it gets a third line in the narrow column; the
       hand-written next move and weekly test stay at two. */
    .evidence-body {
      -webkit-line-clamp: 3;
      line-clamp: 3;
      font-size: calc(var(--u) * 1.25);
      font-weight: 500;
      line-height: 1.35;
      color: rgba(255,255,255,.92);
    }

    .test-body {
      font-size: calc(var(--u) * 1.2);
      font-weight: 500;
      font-style: italic;
      line-height: 1.35;
      color: rgba(255,255,255,.8);
    }

    /* ---- Quote ---------------------------------------------------------- */

    .quote {
      position: absolute;
      right: calc(var(--pad-x) + var(--safe-right));
      bottom: calc(var(--pad-y) + var(--safe-bottom));
      width: calc(var(--u) * 40);
      text-align: right;
      pointer-events: none;
      text-shadow: 0 2px 18px rgba(0,0,0,.82);
    }

    .quote-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: calc(var(--u) * 1.9);
      line-height: 1.22;
      font-style: italic;
      text-wrap: balance;
    }

    .quote-author {
      margin-top: calc(var(--u) * .6);
      font-size: calc(var(--u) * .8);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <main class="app">
    <video id="questVideoA" class="quest-video active" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
    <video id="questVideoB" class="quest-video" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
    <div class="shade"></div>

    <section class="panel">
      <div class="clock">
        <div id="clockTime" class="clock-time"></div>
        <div id="clockDate" class="clock-date"></div>
      </div>

      <div class="quest">
        <div class="quest-count label">
          <span id="questCount"></span>
          <span id="questDots" class="dots"></span>
        </div>
        <h1 id="questTitle" class="title"></h1>
        <div id="phaseTrack" class="phase-track label"></div>

        <div class="sections">
          <div id="nextSection" class="section">
            <div class="label">Next move</div>
            <div id="nextMove" class="section-body next-body"></div>
          </div>

          <div id="evidenceSection" class="section">
            <div class="label">Latest evidence</div>
            <div id="questLine" class="section-body evidence-body"></div>
          </div>

          <div id="testSection" class="section">
            <div class="label">This week</div>
            <div id="passFail" class="section-body test-body"></div>
          </div>
        </div>
      </div>
    </section>

    <aside id="quoteBlock" class="quote hidden">
      <div id="quoteText" class="quote-text"></div>
      <div id="quoteAuthor" class="quote-author"></div>
    </aside>

  </main>

  <script>
    const DATA_URL = "./data.json";
    const VIDEO_LIST_URL = "https://res.cloudinary.com/a3xk0plk/video/list/quest-board-animated.json";
    const REFRESH_MS = 15000;
    const ROTATE_MS = 30000;
    const CROSSFADE_MS = 800;
    // Safety caps; the sections also clamp to two rendered lines in CSS.
    const LINE_MAX_CHARS = 110;
    const NEXT_MAX_CHARS = 80;
    const PASS_FAIL_MAX_CHARS = 100;
    const PHASES = ["Start", "Build", "Push", "Finish"];

    const videos = [
      document.getElementById("questVideoA"),
      document.getElementById("questVideoB")
    ];

    for (const video of videos) {
      video.autoplay = true;
      video.muted = true;
      video.defaultMuted = true;
      video.loop = true;
      video.playsInline = true;
    }

    const el = {
      count: document.getElementById("questCount"),
      dots: document.getElementById("questDots"),
      title: document.getElementById("questTitle"),
      phase: document.getElementById("phaseTrack"),
      nextSection: document.getElementById("nextSection"),
      next: document.getElementById("nextMove"),
      evidenceSection: document.getElementById("evidenceSection"),
      line: document.getElementById("questLine"),
      testSection: document.getElementById("testSection"),
      passFail: document.getElementById("passFail"),
      quoteBlock: document.getElementById("quoteBlock"),
      quote: document.getElementById("quoteText"),
      author: document.getElementById("quoteAuthor")
    };

    let quests = [];
    let currentIndex = 0;
    let activeVideoIndex = 0;
    let loadedVideoKey = "";
    let transitionToken = 0;

    function normalizeId(value = "") {
      return String(value).replace(/-/g, "").toLowerCase();
    }

    function idFromPublicId(publicId = "") {
      return String(publicId).split("/").pop() || "";
    }

    function renderCount() {
      el.count.textContent = `Quest ${currentIndex + 1} / ${quests.length}`;
      el.dots.replaceChildren(...quests.map((_, i) => {
        const dot = document.createElement("span");
        dot.className = "dot" + (i === currentIndex ? " on" : "");
        return dot;
      }));
    }

    function renderPhase(phase) {
      const current = PHASES.indexOf(phase);
      el.phase.replaceChildren(...(current < 0 ? [] : PHASES.map((name, i) => {
        const step = document.createElement("span");
        step.className = "phase-step" + (i < current ? " done" : i === current ? " current" : "");
        step.textContent = name;
        return step;
      })));
      el.phase.classList.toggle("hidden", current < 0);
    }

    // Fill a section's body, or hide the whole section (label included) when
    // there is nothing to say.
    function setSection(section, body, text, max) {
      body.textContent = clipLine(text, max);
      body.title = text;
      section.classList.toggle("hidden", !text);
    }

    // The card shows exactly ONE evidence line. latestEvidence is the display
    // field; statusStatement is a copy of the agent's internal progress
    // assessment and is only used when evidence is empty. Because only one of
    // the two is ever rendered, the card can never repeat the same numbers in
    // a statement and an evidence line at the same time.
    function cardLine(quest) {
      const evidence = String(quest.latestEvidence || "").trim();
      if (evidence) return evidence;
      return String(quest.statusStatement || "").trim();
    }

    function clipLine(text, max = LINE_MAX_CHARS) {
      const clean = String(text || "").replace(/\s+/g, " ").trim();
      if (clean.length <= max) return clean;

      const head = clean.slice(0, max + 1);
      const lastSpace = head.lastIndexOf(" ");
      const cut = lastSpace > max * 0.6 ? head.slice(0, lastSpace) : clean.slice(0, max);
      return cut.replace(/[\s.,;:!?–—-]+$/, "") + "…";
    }

    function renderQuest(quest) {
      if (!quest) return;

      renderCount();
      el.title.textContent = quest.questTitle || "";
      renderPhase(quest.questPhase);

      // Next move and the pass/fail question are written by hand in Notion,
      // so they are optional: a quest without them hides the section.
      setSection(el.nextSection, el.next, String(quest.nextMove || "").trim(), NEXT_MAX_CHARS);

      setSection(el.evidenceSection, el.line, cardLine(quest), LINE_MAX_CHARS);

      setSection(el.testSection, el.passFail, String(quest.passFailQuestion || "").trim(), PASS_FAIL_MAX_CHARS);

      el.quote.textContent = quest.quote ? `“${quest.quote}”` : "";
      el.author.textContent = quest.quoteAuthor || "";
      el.quoteBlock.classList.toggle("hidden", !quest.quote);

      loadVideo(quest);
    }

    function videoKeyForQuest(quest, url) {
      return [
        quest.id || "",
        quest.resolvedVideoVersion || quest.video_version || "",
        url
      ].join("|");
    }

    function clearVideo(video) {
      video.pause();
      video.classList.remove("active");
      video.removeAttribute("src");
      video.load();
    }

    function loadVideo(quest) {
      const url = quest.resolvedVideoUrl || quest.video_url || "";
      if (!url) return;

      const key = videoKeyForQuest(quest, url);
      if (key === loadedVideoKey) return;

      const token = ++transitionToken;
      const outgoingIndex = activeVideoIndex;
      const incomingIndex = outgoingIndex === 0 ? 1 : 0;
      const outgoing = videos[outgoingIndex];
      const incoming = videos[incomingIndex];

      incoming.pause();
      incoming.classList.remove("active");
      incoming.removeAttribute("src");
      incoming.load();
      incoming.src = url;
      incoming.currentTime = 0;
      incoming.load();

      const startCrossfade = async () => {
        if (token !== transitionToken) return;

        incoming.muted = true;
        incoming.defaultMuted = true;

        try {
          await incoming.play();
        } catch (err) {
          console.warn("Autoplay failed:", err);
          return;
        }

        if (token !== transitionToken) return;

        requestAnimationFrame(() => {
          if (token !== transitionToken) return;

          incoming.classList.add("active");
          outgoing.classList.remove("active");
          activeVideoIndex = incomingIndex;
          loadedVideoKey = key;

          setTimeout(() => {
            if (token !== transitionToken) return;
            outgoing.pause();
            outgoing.removeAttribute("src");
            outgoing.load();
          }, CROSSFADE_MS + 100);
        });
      };

      if (incoming.readyState >= 3) {
        startCrossfade();
      } else {
        incoming.addEventListener("canplay", startCrossfade, { once: true });
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), {
        cache: "no-store"
      });
      if (!response.ok) throw new Error(response.status + " " + response.statusText);
      return response.json();
    }

    async function refreshDashboard() {
      try {
        const [stateResult, videoResult] = await Promise.allSettled([
          fetchJson(DATA_URL),
          fetchJson(VIDEO_LIST_URL)
        ]);

        if (stateResult.status !== "fulfilled" || !Array.isArray(stateResult.value)) {
          console.warn("Could not load Active Quest data");
          return;
        }

        const state = stateResult.value;
        const videoMap = new Map();

        if (videoResult.status === "fulfilled") {
          for (const resource of (videoResult.value.resources || [])) {
            const id = idFromPublicId(resource.public_id);
            if (!id) continue;

            const exactUrl =
              resource.secure_url ||
              `https://res.cloudinary.com/a3xk0plk/video/upload/v${resource.version}/${resource.public_id}.${resource.format || "mp4"}`;

            videoMap.set(normalizeId(id), {
              url: exactUrl,
              version: resource.version
            });
          }
        }

        const previousId = quests[currentIndex]?.id || "";

        quests = state
          .filter(item => item && item.id)
          .map(item => {
            const asset = videoMap.get(normalizeId(item.id));
            return {
              ...item,
              resolvedVideoUrl: asset?.url || item.video_url || "",
              resolvedVideoVersion: asset?.version || item.video_version || ""
            };
          });

        if (!quests.length) return;

        if (previousId) {
          const matchedIndex = quests.findIndex(q => q.id === previousId);
          if (matchedIndex >= 0) currentIndex = matchedIndex;
        }

        if (currentIndex >= quests.length) currentIndex = 0;

        renderQuest(quests[currentIndex]);
      } catch (error) {
        console.error("Dashboard refresh failed:", error);
      }
    }

    const clockTime = document.getElementById("clockTime");
    const clockDate = document.getElementById("clockDate");
    const inkCtx = document.createElement("canvas").getContext("2d");

    // Orbitron's left side-bearing differs per digit (about .06em of empty
    // space before "0" or "2", almost none before "1"), so a fixed offset
    // leaves the clock drifting off the column's left edge as the hour
    // changes. Measure the first digit and cancel its bearing instead.
    // Also publish the clock's ink width as --clock-w so the date can center
    // under the clock.
    function alignClock() {
      const style = getComputedStyle(clockTime);
      inkCtx.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
      const text = clockTime.textContent;
      const first = inkCtx.measureText(text.slice(0, 1));
      const whole = inkCtx.measureText(text);
      clockTime.style.marginLeft = first.actualBoundingBoxLeft + "px";
      const inkWidth = whole.actualBoundingBoxLeft + whole.actualBoundingBoxRight;
      if (inkWidth > 0) clockTime.closest(".panel").style.setProperty("--clock-w", inkWidth + "px");
    }

    function renderClock() {
      const now = new Date();
      const time = now.toLocaleTimeString(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      });
      if (clockTime.textContent !== time) {
        clockTime.textContent = time;
        alignClock();
      }
      clockDate.textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        day: "numeric",
        month: "long"
      });
    }

    function nextQuest() {
      if (!quests.length) return;
      currentIndex = (currentIndex + 1) % quests.length;
      renderQuest(quests[currentIndex]);
    }

    renderClock();
    // Re-measure once Orbitron arrives (the first pass measures the fallback
    // font) and when the viewport, and with it the clock size, changes.
    document.fonts?.ready.then(alignClock);
    addEventListener("resize", alignClock);
    // Tick every second so the minute flips on time; the text only changes once a minute.
    setInterval(renderClock, 1000);
    refreshDashboard();
    setInterval(refreshDashboard, REFRESH_MS);
    setInterval(nextQuest, ROTATE_MS);
  </script>
</body>
</html>
