<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quest Board Animated</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
    }

    .quest-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      opacity: 0;
      background: #000;
      pointer-events: none;
    }

    .quest-video.visible {
      opacity: 1;
    }
  </style>
</head>

<body>
  <video id="questA" class="quest-video" muted playsinline preload="auto"></video>
  <video id="questB" class="quest-video" muted playsinline preload="auto"></video>

  <script>
    const CLOUD_NAME = "a3xk0plk";
    const TAG = "quest-board-animated";
    const FOLDER_PREFIX = "Quest-Board-Animated/";

    const DISPLAY_TIME = 30000;       // 30 seconds per quest video
    const LIST_REFRESH_TIME = 60000;  // refresh Cloudinary list every 60 seconds
    const LOOP_HANDOFF_TIME = 0.12;   // switch shortly before the active video actually ends

    const LIST_URL =
      `https://res.cloudinary.com/${CLOUD_NAME}/video/list/${TAG}.json`;

    let quests = [];
    let currentIndex = 0;
    let activeLayer = 0;
    let started = false;
    let currentUrl = "";
    let switching = false;
    let loopSwapPending = false;

    const layers = [
      document.getElementById("questA"),
      document.getElementById("questB")
    ];

    function buildVideoUrl(resource) {
      return `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/v${resource.version}/${resource.public_id}.${resource.format}`;
    }

    async function refreshQuestList() {
      try {
        const response = await fetch(
          `${LIST_URL}?refresh=${Date.now()}`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(`Cloudinary list error: ${response.status}`);
        }

        const data = await response.json();

        const newQuests = (data.resources || [])
          .filter(resource =>
            resource.public_id &&
            resource.public_id.startsWith(FOLDER_PREFIX)
          )
          .map(resource => ({
            publicId: resource.public_id,
            version: resource.version,
            url: buildVideoUrl(resource)
          }));

        if (!newQuests.length) {
          console.warn(`No tagged videos found in ${FOLDER_PREFIX}`);
          return;
        }

        quests = newQuests;

        if (currentIndex >= quests.length) {
          currentIndex = 0;
        }

        if (!started) {
          started = true;
          await showQuest(quests[currentIndex].url, true);
        }
      } catch (error) {
        console.error("Could not refresh quest video list:", error);
      }
    }

    function prepareVideo(video, url) {
      return new Promise((resolve, reject) => {
        video.pause();
        video.classList.remove("visible");

        const absoluteUrl = new URL(url, window.location.href).href;
        if (video.src !== absoluteUrl) {
          video.src = url;
          video.load();
        }

        if (video.readyState >= 3) {
          try { video.currentTime = 0; } catch (_) {}
          resolve();
          return;
        }

        const onReady = () => {
          cleanup();
          try { video.currentTime = 0; } catch (_) {}
          resolve();
        };

        const onError = () => {
          cleanup();
          reject(new Error(`Could not load video: ${url}`));
        };

        const cleanup = () => {
          video.removeEventListener("canplay", onReady);
          video.removeEventListener("error", onError);
        };

        video.addEventListener("canplay", onReady, { once: true });
        video.addEventListener("error", onError, { once: true });
      });
    }

    async function primeStandbyLayer(url) {
      const standbyLayer = layers[1 - activeLayer];
      try {
        await prepareVideo(standbyLayer, url);
        standbyLayer.pause();
        standbyLayer.currentTime = 0;
      } catch (error) {
        console.error("Could not prime standby loop layer:", error);
      }
    }

    async function handoffLoop() {
      if (switching || loopSwapPending || !currentUrl) return;

      const currentLayer = layers[activeLayer];
      const nextLayerIndex = 1 - activeLayer;
      const nextLayer = layers[nextLayerIndex];

      loopSwapPending = true;
      switching = true;

      try {
        if (nextLayer.readyState < 3) {
          await prepareVideo(nextLayer, currentUrl);
        }

        nextLayer.currentTime = 0;
        await nextLayer.play();

        // Instant visual handoff: no opacity transition, no black dip.
        nextLayer.classList.add("visible");
        currentLayer.classList.remove("visible");

        currentLayer.pause();
        currentLayer.currentTime = 0;
        activeLayer = nextLayerIndex;
      } catch (error) {
        console.error("Could not hand off seamless loop:", error);
      } finally {
        switching = false;
        loopSwapPending = false;
      }

      await primeStandbyLayer(currentUrl);
    }

    function monitorLoop() {
      const active = layers[activeLayer];

      if (
        !switching &&
        !loopSwapPending &&
        currentUrl &&
        Number.isFinite(active.duration) &&
        active.duration > 0 &&
        !active.paused &&
        active.duration - active.currentTime <= LOOP_HANDOFF_TIME
      ) {
        handoffLoop();
      }

      requestAnimationFrame(monitorLoop);
    }

    async function showQuest(url, firstLoad = false) {
      if (switching) return;
      switching = true;
      loopSwapPending = false;

      const nextLayerIndex = firstLoad ? activeLayer : 1 - activeLayer;
      const nextLayer = layers[nextLayerIndex];
      const currentLayer = layers[activeLayer];

      try {
        await prepareVideo(nextLayer, url);

        nextLayer.currentTime = 0;
        await nextLayer.play();
        nextLayer.classList.add("visible");

        if (!firstLoad && currentLayer !== nextLayer) {
          currentLayer.classList.remove("visible");
          currentLayer.pause();
          currentLayer.currentTime = 0;
        }

        activeLayer = nextLayerIndex;
        currentUrl = url;
      } catch (error) {
        console.error(error);
      } finally {
        switching = false;
      }

      await primeStandbyLayer(url);
    }

    function nextQuest() {
      if (!quests.length || switching) return;

      currentIndex = (currentIndex + 1) % quests.length;
      showQuest(quests[currentIndex].url);
    }

    refreshQuestList();
    requestAnimationFrame(monitorLoop);

    setInterval(nextQuest, DISPLAY_TIME);
    setInterval(refreshQuestList, LIST_REFRESH_TIME);
  </script>
</body>
</html>
