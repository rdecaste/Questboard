<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Active Quest Board</title>

  <style>
    :root {
      --text: #fff;
      --muted: rgba(255,255,255,.66);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    .app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #questVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #000;
    }

    .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          rgba(0,0,0,.64) 0%,
          rgba(0,0,0,.40) 30%,
          rgba(0,0,0,.10) 52%,
          rgba(0,0,0,0) 72%),
        linear-gradient(0deg,
          rgba(0,0,0,.25) 0%,
          rgba(0,0,0,0) 38%);
    }

    .panel {
      position: absolute;
      left: calc(clamp(26px, 4.5vw, 88px) + var(--safe-left));
      top: 50%;
      transform: translateY(-50%);
      width: min(39vw, 720px);
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      pointer-events: none;
      text-shadow: 0 2px 14px rgba(0,0,0,.72);
    }

    .eyebrow {
      margin-bottom: 12px;
      font-size: clamp(11px, .8vw, 16px);
      font-weight: 750;
      letter-spacing: .19em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .title {
      margin: 0 0 22px;
      font-size: clamp(34px, 3.1vw, 64px);
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      font-size: clamp(12px, .95vw, 18px);
      font-weight: 800;
      letter-spacing: .045em;
      background: transparent;
      border: 0;
    }

    .status::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 14px currentColor;
      flex: 0 0 auto;
    }

    .status.strong { color: #8ef5b2; }
    .status.forward { color: #b6e5ff; }
    .status.slow { color: #ffe59a; }
    .status.stalled { color: #ff9c9c; }
    .status.unknown { color: #d4d8df; }

    .statement {
      margin-bottom: 27px;
      font-size: clamp(17px, 1.4vw, 27px);
      line-height: 1.38;
      font-weight: 520;
      color: rgba(255,255,255,.93);
    }

    .section-label {
      margin-bottom: 7px;
      font-size: clamp(10px, .72vw, 14px);
      font-weight: 750;
      letter-spacing: .17em;
      text-transform: uppercase;
      color: rgba(255,255,255,.55);
    }

    .focus {
      margin-bottom: 24px;
      font-size: clamp(16px, 1.22vw, 23px);
      line-height: 1.35;
      font-weight: 680;
    }

    .meta {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      font-size: clamp(11px, .8vw, 15px);
      color: rgba(255,255,255,.62);
    }

    .quote {
      position: absolute;
      right: calc(clamp(30px, 5vw, 92px) + var(--safe-right));
      bottom: calc(clamp(30px, 5vw, 84px) + var(--safe-bottom));
      width: min(42vw, 760px);
      text-align: right;
      pointer-events: none;
      text-shadow: 0 2px 18px rgba(0,0,0,.82);
    }

    .quote-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 2vw, 40px);
      line-height: 1.22;
      font-style: italic;
      text-wrap: balance;
    }

    .quote-author {
      margin-top: 11px;
      font-size: clamp(11px, .86vw, 16px);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <main class="app">
    <video id="questVideo" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
    <div class="shade"></div>

    <section class="panel">
      <div class="eyebrow">Active Quest</div>
      <h1 id="questTitle" class="title"></h1>
      <div id="questStatus" class="status unknown"></div>
      <div id="statusStatement" class="statement"></div>

      <div id="evidenceBlock">
        <div class="section-label">Latest evidence</div>
        <div id="latestEvidence" class="focus"></div>
      </div>

      <div id="outcomeBlock">
        <div class="section-label">Desired outcome</div>
        <div id="desiredOutcome" class="focus"></div>
      </div>

      <div class="meta">
        <span id="targetDate"></span>
        <span id="lastUpdated"></span>
      </div>
    </section>

  </main>

  <script>
    const DATA_URL = "./data.json";
    const VIDEO_LIST_URL = "https://res.cloudinary.com/a3xk0plk/video/list/quest-board-animated.json";
    const REFRESH_MS = 15000;
    const ROTATE_MS = 30000;

    const video = document.getElementById("questVideo");
    video.autoplay = true;
    video.muted = true;
    video.defaultMuted = true;
    video.loop = true;
    video.playsInline = true;

    const el = {
      title: document.getElementById("questTitle"),
      status: document.getElementById("questStatus"),
      statement: document.getElementById("statusStatement"),
      latestEvidence: document.getElementById("latestEvidence"),
      evidenceBlock: document.getElementById("evidenceBlock"),
      desiredOutcome: document.getElementById("desiredOutcome"),
      outcomeBlock: document.getElementById("outcomeBlock"),
      target: document.getElementById("targetDate"),
      updated: document.getElementById("lastUpdated")
    };

    let quests = [];
    let currentIndex = 0;
    let loadedVideoKey = "";

    function normalizeId(value = "") {
      return String(value).replace(/-/g, "").toLowerCase();
    }

    function idFromPublicId(publicId = "") {
      return String(publicId).split("/").pop() || "";
    }

    function statusClass(status = "") {
      if (status === "STRONG PROGRESS") return "strong";
      if (status === "MOVING FORWARD") return "forward";
      if (status === "SLOW PROGRESS") return "slow";
      if (status === "STALLED") return "stalled";
      return "unknown";
    }

    function formatUpdated(value) {
      if (!value) return "";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "";
      return "Updated " + d.toLocaleDateString(undefined, {
        day: "numeric",
        month: "short"
      });
    }

    function renderQuest(quest) {
      if (!quest) return;

      el.title.textContent = quest.questTitle || "";
      el.status.textContent = quest.status || "NOT ENOUGH INFORMATION";
      el.status.className = "status " + statusClass(quest.status);
      el.statement.textContent = quest.statusStatement || "";

      el.latestEvidence.textContent = quest.latestEvidence || "";
      el.evidenceBlock.classList.toggle("hidden", !quest.latestEvidence);

      el.desiredOutcome.textContent = quest.desiredOutcome || "";
      el.outcomeBlock.classList.toggle("hidden", !quest.desiredOutcome);

      el.target.textContent = quest.targetDate ? "Target · " + quest.targetDate : "";
      el.updated.textContent = formatUpdated(quest.updatedAt);

      loadVideo(quest);
    }

    function loadVideo(quest) {
      const url = quest.resolvedVideoUrl || quest.video_url || "";
      const key = String(
        quest.resolvedVideoVersion ||
        quest.video_version ||
        url
      );

      if (!url || key === loadedVideoKey) return;

      loadedVideoKey = key;

      video.pause();
      video.removeAttribute("src");
      video.load();

      video.src = url;
      video.load();

      const tryPlay = () => {
        video.muted = true;
        video.defaultMuted = true;
        video.play().catch(err => console.warn("Autoplay failed:", err));
      };

      if (video.readyState >= 2) {
        tryPlay();
      } else {
        video.addEventListener("loadeddata", tryPlay, { once: true });
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), {
        cache: "no-store"
      });
      if (!response.ok) throw new Error(response.status + " " + response.statusText);
      return response.json();
    }

    async function refreshDashboard() {
      try {
        const [stateResult, videoResult] = await Promise.allSettled([
          fetchJson(DATA_URL),
          fetchJson(VIDEO_LIST_URL)
        ]);

        if (stateResult.status !== "fulfilled" || !Array.isArray(stateResult.value)) {
          console.warn("Could not load Active Quest data");
          return;
        }

        const state = stateResult.value;
        const videoMap = new Map();

        if (videoResult.status === "fulfilled") {
          for (const resource of (videoResult.value.resources || [])) {
            const id = idFromPublicId(resource.public_id);
            if (!id) continue;

            const exactUrl =
              resource.secure_url ||
              `https://res.cloudinary.com/a3xk0plk/video/upload/v${resource.version}/${resource.public_id}.${resource.format || "mp4"}`;

            videoMap.set(normalizeId(id), {
              url: exactUrl,
              version: resource.version
            });
          }
        }

        const previousId = quests[currentIndex]?.id || "";

        quests = state
          .filter(item => item && item.id)
          .map(item => {
            const asset = videoMap.get(normalizeId(item.id));
            return {
              ...item,
              resolvedVideoUrl: asset?.url || item.video_url || "",
              resolvedVideoVersion: asset?.version || item.video_version || ""
            };
          });

        if (!quests.length) return;

        if (previousId) {
          const matchedIndex = quests.findIndex(q => q.id === previousId);
          if (matchedIndex >= 0) currentIndex = matchedIndex;
        }

        if (currentIndex >= quests.length) currentIndex = 0;

        renderQuest(quests[currentIndex]);
      } catch (error) {
        console.error("Dashboard refresh failed:", error);
      }
    }

    function nextQuest() {
      if (!quests.length) return;
      currentIndex = (currentIndex + 1) % quests.length;
      renderQuest(quests[currentIndex]);
    }

    refreshDashboard();
    setInterval(refreshDashboard, REFRESH_MS);
    setInterval(nextQuest, ROTATE_MS);
  </script>
</body>
</html>
